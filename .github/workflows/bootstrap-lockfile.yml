name: Bootstrap pnpm lockfile

on:
  push:
    branches:
      - feat/nuxt-foundation

permissions:
  contents: write

jobs:
  generate:
    if: ${{ !contains(github.event.head_commit.message, '[lockfile bootstrap]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout branch
        uses: actions/checkout@v7
        with:
          ref: feat/nuxt-foundation
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Generate lockfile
        run: pnpm install --lockfile-only --ignore-scripts

      - name: Commit lockfile and remove bootstrap workflow
        run: |
          rm .github/workflows/bootstrap-lockfile.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml .github/workflows/bootstrap-lockfile.yml
          git commit -m "chore: add pnpm lockfile [lockfile bootstrap]"
          git push origin HEAD:feat/nuxt-foundation
