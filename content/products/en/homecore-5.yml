name: MAXIBUD HomeCore 5
category: Modular home system
tagline: Keep essential systems running.
summary: A concept stationary format for homes, small offices, and essential-system backup.
overview:
  lead: HomeCore 5 is the modular stationary concept at the center of the MAXIBUD ENERGY portfolio.
  paragraphs:
    - One 5.12 kWh module establishes the base format, while a conceptual four-module arrangement extends the portfolio capacity to 20.48 kWh for home and small-business contexts.
    - HomeCore 5 is an energy-storage module concept. It requires compatible external power-conversion, protection, and installation design rather than connecting directly to household wiring.
features:
  - title: Modular capacity
    description: The concept develops from one 5.12 kWh module to a four-module portfolio arrangement with up to 20.48 kWh.
  - title: Architectural stationary form
    description: A slim wall-mounted or floor-stand enclosure separates the home format from the portfolio’s portable systems.
  - title: Passive cooling concept
    description: The product concept uses passive cooling in its normal presentation without promising silent operation in a complete installed system.
  - title: Compatible-system approach
    description: Power conversion and peak output depend on compatible external equipment and a defined system configuration.
  - title: Local monitoring concept
    description: A local web dashboard concept presents state of charge, energy flow, and module status.
applications:
  - title: Essential home systems
    description: Intended as an energy-storage concept for selected lighting, network, heating-control, and security loads after system design.
  - title: Small office continuity
    description: A stationary concept for selected network equipment and workstations without a guaranteed backup duration.
  - title: Small retail support
    description: A modular context for selected refrigeration, point-of-service, or communications loads after compatibility assessment.
  - title: Capacity planning
    description: A portfolio format for discussing one-to-four-module configurations before qualified electrical design.
detailVisualDescription: Original project-owned concept illustration of the slim HomeCore 5 module with modular sections, a narrow status strip, wall-mount details, and a floor stand.
conceptNotice: HomeCore 5 specifications are illustrative and do not describe certified commercial hardware.
