<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc">
  <title id="title">Контекст і межі інформаційної вебсистеми</title>
  <desc id="desc">Схема показує користувачів, навчальну вебсистему MAXIBUD ENERGY, три концептуальні продукти та функції, що не входять до системи.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <marker id="arrow-orange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#c2410c"/></marker>
    <style>
      text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#0f172a}.label{font-size:18px;font-weight:600}.small{font-size:15px}.group{font-size:20px;font-weight:700}.box{fill:#f8fafc;stroke:#334155;stroke-width:2}.accent{fill:#eef5e5;stroke:#365314;stroke-width:3}.outside{fill:#fff7ed;stroke:#c2410c;stroke-width:2}.system{fill:#ffffff;stroke:#334155;stroke-width:2.5}.productGroup{fill:#f8fafc;stroke:#94a3b8;stroke-width:2}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#c2410c;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow-orange)}
    </style>
  </defs>

