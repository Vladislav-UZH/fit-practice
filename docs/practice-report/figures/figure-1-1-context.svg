  <text x="597" y="118" text-anchor="middle" class="small"><tspan x="597" dy="0">Українська та англійська</tspan><tspan x="597" dy="20">локалізації</tspan></text>

  <rect x="492" y="188" width="210" height="58" rx="16" class="box"/>
