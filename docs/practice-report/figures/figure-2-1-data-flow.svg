<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">Потік локалізованих продуктових даних</title>
  <desc id="desc">Схема показує шлях від локалізованого YAML-запису через Nuxt Content, Zod, Nitro API та Nuxt-сторінку до SSR-інтерфейсу, а також автоматизовані перевірки.</desc>
  <defs>
    <marker id="a" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#0f172a}.h{font-size:22px;font-weight:700}.t{font-size:16px;font-weight:600}.s{font-size:14px}.box{stroke-width:2;rx:16}.green{fill:#ecfdf5;stroke:#047857}.purple{fill:#f5f3ff;stroke:#6d28d9}.blue{fill:#eff6ff;stroke:#1d4ed8}.orange{fill:#fff7ed;stroke:#c2410c}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#a)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 7;fill:none;marker-end:url(#a)}
    </style>
  </defs>
  <text x="600" y="42" text-anchor="middle" class="h">Потік локалізованих продуктових даних</text>

  <rect x="35" y="105" width="180" height="72" class="box green"/>
  <text x="125" y="133" text-anchor="middle" class="s"><tspan x="125">Локалізований</tspan><tspan x="125" dy="20">YAML-запис</tspan></text>

  <rect x="255" y="82" width="210" height="118" class="box green"/>
  <text x="360" y="116" text-anchor="middle" class="t">Nuxt Content</text>
  <text x="360" y="142" text-anchor="middle" class="s">колекція продуктів</text>
  <line x1="278" y1="158" x2="442" y2="158" stroke="#047857" stroke-width="1.5"/>
  <text x="360" y="182" text-anchor="middle" class="s">Zod-перевірка структури</text>

  <rect x="505" y="75" width="205" height="70" class="box purple"/>
  <text x="607" y="104" text-anchor="middle" class="s"><tspan x="607">API списку</tspan><tspan x="607" dy="20">продуктів</tspan></text>
  <rect x="505" y="160" width="205" height="70" class="box purple"/>
  <text x="607" y="189" text-anchor="middle" class="s"><tspan x="607">API продукту</tspan><tspan x="607" dy="20">за slug</tspan></text>

  <rect x="755" y="105" width="170" height="72" class="box blue"/>
  <text x="840" y="134" text-anchor="middle" class="s"><tspan x="840">Nuxt-сторінка</tspan><tspan x="840" dy="20">та useFetch</tspan></text>

  <rect x="970" y="105" width="185" height="72" class="box blue"/>
  <text x="1062" y="134" text-anchor="middle" class="s"><tspan x="1062">Vue-компоненти</tspan><tspan x="1062" dy="20">SSR-інтерфейсу</tspan></text>

  <path d="M215 141 H255" class="line"/>
  <path d="M465 120 H505" class="line"/>
  <path d="M465 174 H505" class="line"/>
  <path d="M710 110 C728 110 735 141 755 141" class="line"/>
  <path d="M710 195 C728 195 735 141 755 141" class="line"/>
  <path d="M925 141 H970" class="line"/>

  <rect x="80" y="365" width="250" height="88" class="box orange"/>
  <text x="205" y="398" text-anchor="middle" class="t">Vitest і Playwright</text>
  <text x="205" y="424" text-anchor="middle" class="s">автоматизовані перевірки</text>

  <rect x="420" y="340" width="250" height="138" rx="20" fill="#f8fafc" stroke="#94a3b8" stroke-width="2"/>
  <text x="545" y="373" text-anchor="middle" class="t">Перевіряються</text>
  <text x="545" y="404" text-anchor="middle" class="s">схеми й порядок даних</text>
  <text x="545" y="428" text-anchor="middle" class="s">відповіді API та 404</text>
  <text x="545" y="452" text-anchor="middle" class="s">локалізовані маршрути й UI</text>

  <path d="M330 408 H420" class="dash"/>
  <path d="M545 340 C520 285 430 250 360 200" class="dash"/>
  <path d="M670 395 C740 360 790 260 840 177" class="dash"/>
  <path d="M670 430 C820 450 990 330 1062 177" class="dash"/>

  <text x="600" y="548" text-anchor="middle" class="s">Одна зміна в локалізованому записі використовується на всіх сторінках без дублювання характеристик</text>
</svg>