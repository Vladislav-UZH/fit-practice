<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="820" viewBox="0 0 1200 820" role="img" aria-labelledby="title desc">
  <title id="title">Узагальнена архітектура інформаційної вебсистеми</title>
  <desc id="desc">Схема показує шар представлення, серверний шар Nitro, контентний і схемний шари та перевірки якості.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker>
    <style>
      text{font-family:Arial,'DejaVu Sans',sans-serif;fill:#0f172a}.group{font-size:20px;font-weight:700}.label{font-size:17px;font-weight:600}.small{font-size:15px}.line{stroke:#64748b;stroke-width:2.2;fill:none;marker-end:url(#arrow)}.dash{stroke:#64748b;stroke-width:2;stroke-dasharray:8 8;fill:none;marker-end:url(#arrow)}.user{fill:#f8fafc;stroke:#334155;stroke-width:3}.presentation{fill:#eff6ff;stroke:#1d4ed8;stroke-width:2}.server{fill:#f5f3ff;stroke:#6d28d9;stroke-width:2}.data{fill:#ecfdf5;stroke:#047857;stroke-width:2}.quality{fill:#fff7ed;stroke:#c2410c;stroke-width:2}
    </style>
  </defs>

  <rect x="32" y="114" width="160" height="64" rx="18" class="user"/>
  <text x="112" y="153" text-anchor="middle" class="label">Користувач</text>

  <rect x="232" y="34" width="480" height="330" rx="24" fill="#ffffff" stroke="#1d4ed8" stroke-width="2.5"/>
  <text x="472" y="70" text-anchor="middle" class="group">Шар представлення: app</text>

  <rect x="376" y="92" width="192" height="58" rx="15" class="presentation"/>
  <text x="472" y="117" text-anchor="middle" class="small"><tspan x="472">SEO-метадані та</tspan><tspan x="472" dy="18">локалізовані маршрути</tspan></text>

  <rect x="372" y="188" width="200" height="58" rx="15" class="presentation"/>
  <text x="472" y="224" text-anchor="middle" class="label">Nuxt pages і layouts</text>

  <rect x="266" y="284" width="176" height="58" rx="15" class="presentation"/>
  <text x="354" y="320" text-anchor="middle" class="label">Vue-компоненти</text>

  <rect x="486" y="284" width="194" height="58" rx="15" class="presentation"/>
  <text x="583" y="309" text-anchor="middle" class="small"><tspan x="583">Composables і локалізовані</tspan><tspan x="583" dy="18">утиліти</tspan></text>

  <path d="M192 146 H336 C350 146 360 180 390 188" class="line"/>
  <path d="M472 150 V188" class="line"/>
  <path d="M430 246 L372 284" class="line"/>
  <path d="M514 246 L558 284" class="line"/>

  <rect x="232" y="406" width="480" height="254" rx="24" fill="#ffffff" stroke="#6d28d9" stroke-width="2.5"/>
  <text x="472" y="442" text-anchor="middle" class="group">Серверний шар: Nitro</text>

  <rect x="266" y="472" width="190" height="58" rx="15" class="server"/>
  <text x="361" y="507" text-anchor="middle" class="label">API списку продуктів</text>

  <rect x="488" y="472" width="190" height="58" rx="15" class="server"/>
  <text x="583" y="507" text-anchor="middle" class="label">API продукту за slug</text>

  <rect x="348" y="572" width="248" height="62" rx="15" class="server"/>
  <text x="472" y="598" text-anchor="middle" class="small"><tspan x="472">Перевірка параметрів і</tspan><tspan x="472" dy="18">контрольовані помилки</tspan></text>

