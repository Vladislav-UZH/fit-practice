  <path d="M959 162 V202" class="line"/>
  <path d="M959 260 V298" class="line"/>
  <path d="M832 130 C760 150 720 246 678 300" class="line"/>
  <path d="M842 230 C744 270 694 500 596 586" class="line"/>

  <rect x="750" y="406" width="418" height="350" rx="24" fill="#ffffff" stroke="#c2410c" stroke-width="2.5"/>
  <text x="959" y="442" text-anchor="middle" class="group">Перевірка якості</text>

  <rect x="866" y="472" width="186" height="58" rx="15" class="quality"/>
  <text x="959" y="507" text-anchor="middle" class="label">GitHub Actions</text>

  <rect x="772" y="572" width="172" height="58" rx="15" class="quality"/>
  <text x="858" y="607" text-anchor="middle" class="label">Playwright E2E</text>

  <rect x="974" y="572" width="172" height="58" rx="15" class="quality"/>
  <text x="1060" y="598" text-anchor="middle" class="small"><tspan x="1060">Vitest і Nuxt</tspan><tspan x="1060" dy="18">runtime tests</tspan></text>

  <rect x="856" y="674" width="206" height="58" rx="15" class="quality"/>
  <text x="959" y="699" text-anchor="middle" class="small"><tspan x="959">Lint, typecheck і</tspan><tspan x="959" dy="18">production build</tspan></text>

  <path d="M959 530 L858 572" class="line"/>
  <path d="M959 530 L1060 572" class="line"/>
  <path d="M959 530 V674" class="line"/>

  <path d="M858 630 C770 650 690 650 590 620" class="dash"/>
  <path d="M1060 630 C940 648 744 684 588 628" class="dash"/>
