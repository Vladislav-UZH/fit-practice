  <rect x="832" y="100" width="254" height="62" rx="15" class="data"/>
  <text x="959" y="126" text-anchor="middle" class="small"><tspan x="959">Спільні Zod-схеми та</tspan><tspan x="959" dy="18">TypeScript-типи</tspan></text>

  <rect x="842" y="202" width="234" height="58" rx="15" class="data"/>
